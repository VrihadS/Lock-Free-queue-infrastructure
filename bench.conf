# Core pinning for bench_nblfq.
#
# Producer i runs on producer_cores[i], consumer i on consumer_cores[i].
# The 1P+1C runs (and SPSC) use the first entry of each list; the 2P+2C run
# needs at least 2 entries in each list, and 4P+4C needs at least 4.
# A core may appear only once across both lists.
#
# Find your isolated cores with:  cat /sys/devices/system/cpu/isolated
# Check hyperthread siblings with: lscpu -e
producer_cores = 2, 4, 6, 8
consumer_cores = 3, 5, 7, 9

# Operations per producer thread.
ops = 1000000
